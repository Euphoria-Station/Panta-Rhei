# Ears

- type: marking
  id: EarsShadowkin
  bodyPart: HeadTop
  forcedColoring: true
  sprites:
    - sprite: _Floof/Mobs/Customization/Shadowkin/ears.rsi
      state: shadowkin

- type: marking
  id: EarsShadowkinStriped
  bodyPart: HeadTop
  coloring:
    default:
      type:
        !type:SkinColoring
    layers:
      shadowkin_stripes:
        type:
          !type:SimpleColoring
            color: "#FFFFFF"
  sprites:
    - sprite: _Floof/Mobs/Customization/Shadowkin/ears.rsi
      state: shadowkin
    - sprite: _Floof/Mobs/Customization/Shadowkin/ears.rsi
      state: shadowkin_stripes

