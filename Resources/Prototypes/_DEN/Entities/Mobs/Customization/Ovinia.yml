- type: marking
  id: SatyrCowPrint
  # speciesRestriction: [ Ovinia ] # Euph - free markings
  bodyPart: Chest
  coloring:
    default:
      type: !type:SimpleColoring
          color: "#2c2c2c"
  layering:
    satyr_cow_body: Chest
    satyr_cow_left_leg: LLeg
    satyr_cow_right_leg: RLeg
  colorLinks:
    satyr_cow_left_leg: satyr_cow_body
    satyr_cow_right_leg: satyr_cow_body
  sprites:
    - sprite: _DEN/Mobs/Customization/Ovinia/satyr_markings.rsi
      state: satyr_cow_body
    - sprite: _DEN/Mobs/Customization/Ovinia/satyr_markings.rsi
      state: satyr_cow_left_leg
    - sprite: _DEN/Mobs/Customization/Ovinia/satyr_markings.rsi
