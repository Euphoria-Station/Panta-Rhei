# Satyr Markings
- type: marking
  id: SatyrChestMale
  bodyPart: Chest
  # speciesRestriction: [ Ovinia ] # Euph - free markings
  sexRestriction: Male
  coloring:
    default:
      type:
        !type:SkinColoring
    layers:
      satyr_torso_m:
        type:
          !type:SimpleColoring
            color: "#ffdad1"
      satyr_torso_fur:
        type:
          !type:SkinColoring
  sprites:
    - sprite: _DEN/Mobs/Customization/Ovinia/satyr_markings.rsi
      state: satyr_torso_m
    - sprite: _DEN/Mobs/Customization/Ovinia/satyr_markings.rsi
      state: satyr_torso_fur

